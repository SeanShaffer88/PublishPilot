[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "publishpilot"
version = "0.1.0"
description = "Hardened preflight, manifest, and read-back verification for publishing text files to GitHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Shaffer" }]
dependencies = []

[project.scripts]
publishpilot = "publishpilot:main"

[tool.setuptools]
py-modules = ["publishpilot"]
